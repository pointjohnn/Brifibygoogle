name: Build Brifi APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        working-directory: Brifi
        run: gradle test

      - name: Assemble Debug APK
        working-directory: Brifi
        run: gradle assembleDebug

      - name: Upload Brifi-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brifi-APK
          path: Brifi/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
